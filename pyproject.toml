[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trendpilot"
version = "0.1.0"
description = "Human-approved US equity momentum and VCP proposal engine"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "yfinance>=0.2.50",
  "curl-cffi>=0.10",
]

[project.optional-dependencies]
research = ["vectorbt>=0.28"]
ibkr = ["ibapi>=9.81"]
dev = ["pytest>=8"]

[project.scripts]
trendpilot = "trendpilot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
