[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trendpilot-lite"
version = "0.1.0"
description = "A compact Stage 2 and volatility-contraction stock scanner"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "yfinance>=0.2.50",
  "curl-cffi>=0.7",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
research = ["vectorbt>=0.28"]
ibkr = ["ibapi>=9.81.1"]

[project.scripts]
trendpilot = "trendpilot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
